# EMQX 5.x override config — authentication and authorization are DELEGATED to the
# platform server over HTTP (the broker holds no credential state at all).
# Device rule enforced server-side: username must equal clientid, password is the
# per-device secret verified against an argon2id hash; the platform server account
# is returned as superuser (bypasses ACL so it may use $share subscriptions).
#
# NOTE: the x-internal-token header must match the server's INTERNAL_TOKEN env
# (default dev-internal-token) — override both together for non-local deployments.

# This file REPLACES the image's stock emqx.conf, so the node basics it normally
# provides must be restated (they are schema-required fields).
node {
  name = "emqx@127.0.0.1"
  cookie = "iot-fleet-dev-cookie"
  data_dir = "data"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10240
}

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://server:8080/api/internal/mqtt/auth"
    headers {
      "content-type" = "application/json"
      "x-internal-token" = "dev-internal-token"
    }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    connect_timeout = "5s"
    request_timeout = "5s"
    pool_size = 8
    enable_pipelining = 100
  }
]

authorization {
  no_match = deny
  cache { enable = true }
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://server:8080/api/internal/mqtt/acl"
      headers {
        "content-type" = "application/json"
        "x-internal-token" = "dev-internal-token"
      }
      body {
        clientid = "${clientid}"
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      connect_timeout = "5s"
      request_timeout = "5s"
    }
  ]
}
