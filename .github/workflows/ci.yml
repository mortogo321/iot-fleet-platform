name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test apps packages

      - name: Build web
        run: bun run --filter web build

      - name: Build Docker images (server + simulator)
        run: |
          docker build --target server -t iot-server:ci .
          docker build --target simulator -t iot-simulator:ci .
